name: Backlog and Groma contextual integration smoke

on:
  pull_request:
    paths:
      - '.github/workflows/backlog-context-integration.yml'
      - '.claude-plugin/marketplace.json'
      - 'plugins/backlog-context/**'
      - 'skills/backlog-agile-workflow/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install real CLI tools in ephemeral runner
        run: |
          npm install --global @anthropic-ai/claude-code backlog.md
          bun install --global groma.md
          claude --version
          backlog --version
          groma --version
      - name: Validate plugin and marketplace with official Claude Code CLI
        run: |
          claude plugin validate --strict ./plugins/backlog-context
          claude plugin validate --strict .
      - name: Initialize disposable project and exercise real Backlog CLI
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          cd "$fixture"
          git init -q
          git config user.email smoke@example.invalid
          git config user.name "Ephemeral Smoke"
          mkdir src
          printf 'export const answer = 42;\n' > src/example.ts
          backlog init "Context Smoke" --defaults --no-git
          backlog task create "Validate contextual tracking" --ac "Read-only tooling does not change task state"
          # Native Backlog decisions are the durable source of decision metadata.
          # The published CLI may lack --context/--decision flags even if main docs show them.
          backlog decision create --help > decision-create-help.txt
          backlog decision create "Context policy"
          backlog decision list --json > decisions.json
          node -e 'const d=require("./decisions.json");if(d.kind!=="decision-list"||d.schemaVersion!==1||d.decisions.length!==1)process.exit(1)'
          # 1.55.3 lacks 'decision view'; never assume unreleased subcommands.
          if backlog decision --help | grep -Eq '(^|[[:space:]])view([[:space:]]|$)'; then
            backlog decision view decision-1 --json > decision-view.json
          fi
          backlog task list --json > tasks-before.json
          node -e 'const a=require("./tasks-before.json");if(a.kind!=="task-list"||a.tasks.length<1)process.exit(1)'
          backlog task list --json > tasks-after.json
          diff -u tasks-before.json tasks-after.json
      - name: Validate WIP preflight against real Backlog task-list JSON
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          backlog task view TASK-1 --json > /tmp/wip-task-view.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from os import environ
          fixture = Path(environ['FIXTURE'])
          board = json.loads((fixture / 'tasks-before.json').read_text())
          task = json.loads(Path('/tmp/wip-task-view.json').read_text())['task']
          payload = {
              'schemaVersion': 1, 'kind': 'board-operation', 'operation': 'transition',
              'statuses': ['To Do', 'In Progress', 'Done'],
              'defaultStatus': 'To Do', 'terminalStatus': 'Done', 'targetStatus': 'In Progress',
              'task': {key: task[key] for key in ('id', 'status', 'archived', 'isReady', 'assignees')},
              'wipPolicy': {'activeStatuses': ['In Progress'], 'maxGlobal': 3, 'maxPerAssignee': 1},
              'boardSnapshot': board, 'boardComplete': True,
              'config': {'autoCommit': False, 'remoteOperations': False,
                         'bypassGitHooks': False, 'onStatusChange': False},
              'authorized': False
          }
          Path('/tmp/wip-preflight.json').write_text(json.dumps(payload))
          PY
          python3 "$GITHUB_WORKSPACE/skills/backlog-agile-workflow/scripts/board_crud.py" /tmp/wip-preflight.json > /tmp/wip-proposal.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/wip-proposal.json').read_text())
          assert result['decision'] == 'PROPOSE_ONLY', result
          assert result['suggestedArgv'][-2:] == ['-s', 'In Progress'], result
          PY
      - name: Exercise real Groma CLI without launching servers or scanning implicitly
        run: |
          set -euxo pipefail
          cd "$FIXTURE"
          groma init "Context Smoke" --directory groma
          test -f groma/project.md
          test -f groma/index.md
          # The work-source configuration is optional until explicitly adding a plugin.
          groma plugin add backlog
          test -f groma/config.json
          groma plugin list | grep -i backlog
          backlog task list --json > /tmp/backlog-after-groma-link.json
          diff -u tasks-before.json /tmp/backlog-after-groma-link.json
          find groma -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/groma-before.txt
          groma agent-instructions inspect > /tmp/groma-guidance.txt
          groma view src/example.ts > /tmp/groma-view.txt 2>&1 || true
          find groma -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/groma-after.txt
          diff -u /tmp/groma-before.txt /tmp/groma-after.txt
      - name: Exercise plugin hook JSON with real project and CLI
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          mkdir -p "$RUNNER_TEMP/context-state"
          export CLAUDE_PROJECT_DIR="$FIXTURE"
          export CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/context-state"
          printf '{"hook_event_name":"SessionStart","session_id":"smoke01","cwd":"%s"}' "$FIXTURE" |
            node --experimental-strip-types "$GITHUB_WORKSPACE/plugins/backlog-context/src/hook.ts" > /tmp/hook-output.json
          node -e 'const a=require("/tmp/hook-output.json");if(a.hookSpecificOutput?.hookEventName!=="SessionStart")process.exit(1)'
          printf '{"hook_event_name":"PostToolBatch","session_id":"smoke01","cwd":"%s","tool_calls":[{"tool_name":"Read","tool_input":{"file_path":"%s/src/example.ts"},"tool_response":"source"}]}' "$FIXTURE" "$FIXTURE" |
            node --experimental-strip-types "$GITHUB_WORKSPACE/plugins/backlog-context/src/hook.ts" > /tmp/hook-batch.json
          # A missing Groma owner is acceptable: no scan is run by the hook.
          test ! -s /tmp/hook-batch.json || node -e 'const a=require("/tmp/hook-batch.json");if(a.hookSpecificOutput?.hookEventName!=="PostToolBatch")process.exit(1)'
          backlog task list --json > tasks-final.json
          diff -u tasks-before.json tasks-final.json
          find groma -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/groma-final.txt
          diff -u /tmp/groma-before.txt /tmp/groma-final.txt
      - name: Smoke Backlog native documents and semantic tags in disposable project
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          backlog doc create "Run term" -t other -p glossary/execution > /tmp/term-created.txt
          docid="$(sed -n 's/^Created document //p' /tmp/term-created.txt)"
          docpath="$(sed -n 's/^Path: //p' /tmp/term-created.txt)"
          test -n "$docid"
          test -n "$docpath"
          backlog doc update "$docid" --tags 'kind:term,ctx:execution,term:execution.run'
          backlog doc update "$docid" --content '# Run (execution)'
          backlog doc view "$docid" --plain > /tmp/term-view.txt
          grep -q 'execution.run' /tmp/term-view.txt
          backlog task edit TASK-1 --add-doc "$docpath"
          backlog task view TASK-1 --json > /tmp/term-task-view.json
          node -e 'const t=require("/tmp/term-task-view.json").task; if (!t.documentation || !t.documentation.some(x=>x.includes("doc-"))) process.exit(1)'
          python3 "$GITHUB_WORKSPACE/skills/backlog-agile-workflow/scripts/knowledge_graph.py" \
            "$GITHUB_WORKSPACE/skills/backlog-agile-workflow/examples/knowledge-corpus.json" --mode export --output "$FIXTURE/knowledge-okf"
          test -f "$FIXTURE/knowledge-okf/index.md"
          test -f "$FIXTURE/knowledge-okf/glossary/execution.run.md"
