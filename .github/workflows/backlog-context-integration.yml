name: Backlog and Groma contextual integration smoke

on:
  pull_request:
    paths:
      - '.github/workflows/backlog-context-integration.yml'
      - '.claude-plugin/marketplace.json'
      - 'plugins/backlog-context/**'
      - 'skills/backlog-agile-workflow/**'
      - 'skills/software-knowledge/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cli-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install real CLI tools in ephemeral runner
        run: |
          npm install --global @anthropic-ai/claude-code backlog.md
          bun install --global groma.md
          claude --version
          backlog --version
          groma --version
      - name: Validate plugin and marketplace with official Claude Code CLI
        run: |
          claude plugin validate --strict ./plugins/backlog-context
          claude plugin validate --strict .
      - name: Initialize disposable project and exercise real Backlog CLI
        run: |
          set -euo pipefail
          fixture="$(mktemp -d)"
          echo "FIXTURE=$fixture" >> "$GITHUB_ENV"
          cd "$fixture"
          git init -q
          git config user.email smoke@example.invalid
          git config user.name "Ephemeral Smoke"
          mkdir src
          printf 'export const answer = 42;\n' > src/example.ts
          backlog init "Context Smoke" --defaults --no-git
          backlog task create "Validate contextual tracking" --ac "Read-only tooling does not change task state"
          # Native Backlog decisions are the durable source of decision metadata.
          # The published CLI may lack --context/--decision flags even if main docs show them.
          backlog decision create --help > decision-create-help.txt
          backlog decision create "Context policy"
          backlog decision list --json > decisions.json
          node -e 'const d=require("./decisions.json");if(d.kind!=="decision-list"||d.schemaVersion!==1||d.decisions.length!==1)process.exit(1)'
          # 1.55.3 lacks 'decision view'; never assume unreleased subcommands.
          if backlog decision --help | grep -Eq '(^|[[:space:]])view([[:space:]]|$)'; then
            backlog decision view decision-1 --json > decision-view.json
          fi
          backlog task list --json > tasks-before.json
          node -e 'const a=require("./tasks-before.json");if(a.kind!=="task-list"||a.tasks.length<1)process.exit(1)'
          backlog task list --json > tasks-after.json
          diff -u tasks-before.json tasks-after.json
      - name: Validate hardened multiagent planner and structured harness bridges
        run: |
          python3 -m unittest discover -s skills/backlog-agile-workflow/tests -p 'test_multi_agent.py' -v
          python3 -m unittest discover -s skills/backlog-agile-workflow/tests -p 'test_multi_agent_scheduler.py' -v
          python3 -m unittest discover -s skills/backlog-agile-workflow/tests -p 'test_harness_*.py' -v
      - name: Validate multiagent claims, handoff and fencing against real Backlog.md
        run: python3 skills/backlog-agile-workflow/scripts/smoke_real_backlog.py
      - name: Validate WIP preflight against real Backlog task-list JSON
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          backlog task view TASK-1 --json > /tmp/wip-task-view.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from os import environ
          fixture = Path(environ['FIXTURE'])
          board = json.loads((fixture / 'tasks-before.json').read_text())
          task = json.loads(Path('/tmp/wip-task-view.json').read_text())['task']
          payload = {
              'schemaVersion': 1, 'kind': 'board-operation', 'operation': 'transition',
              'statuses': ['To Do', 'In Progress', 'Done'],
              'defaultStatus': 'To Do', 'terminalStatus': 'Done', 'targetStatus': 'In Progress',
              'task': {key: task[key] for key in ('id', 'status', 'archived', 'isReady', 'assignees')},
              'wipPolicy': {'activeStatuses': ['In Progress'], 'maxGlobal': 3, 'maxPerAssignee': 1},
              'boardSnapshot': board, 'boardComplete': True,
              'config': {'autoCommit': False, 'remoteOperations': False,
                         'bypassGitHooks': False, 'onStatusChange': False},
              'authorized': False
          }
          Path('/tmp/wip-preflight.json').write_text(json.dumps(payload))
          PY
          python3 "$GITHUB_WORKSPACE/skills/backlog-agile-workflow/scripts/board_crud.py" /tmp/wip-preflight.json > /tmp/wip-proposal.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/wip-proposal.json').read_text())
          assert result['decision'] == 'PROPOSE_ONLY', result
          assert result['suggestedArgv'][-2:] == ['-s', 'In Progress'], result
          PY
      - name: Exercise real Groma CLI without launching servers or scanning implicitly
        run: |
          set -euxo pipefail
          cd "$FIXTURE"
          groma init "Context Smoke" --directory groma
          test -f groma/project.md
          test -f groma/index.md
          # The work-source configuration is optional until explicitly adding a plugin.
          groma plugin add backlog
          test -f groma/config.json
          groma plugin list | grep -i backlog
          backlog task list --json > /tmp/backlog-after-groma-link.json
          diff -u tasks-before.json /tmp/backlog-after-groma-link.json
          find groma -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/groma-before.txt
          groma agent-instructions inspect > /tmp/groma-guidance.txt
          groma view src/example.ts > /tmp/groma-view.txt 2>&1 || true
          find groma -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/groma-after.txt
          diff -u /tmp/groma-before.txt /tmp/groma-after.txt
      - name: Exercise plugin hook JSON with real project and CLI
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          mkdir -p "$RUNNER_TEMP/context-state"
          export CLAUDE_PROJECT_DIR="$FIXTURE"
          export CLAUDE_PLUGIN_DATA="$RUNNER_TEMP/context-state"
          printf '{"hook_event_name":"SessionStart","session_id":"smoke01","cwd":"%s"}' "$FIXTURE" |
            node --experimental-strip-types "$GITHUB_WORKSPACE/plugins/backlog-context/src/hook.ts" > /tmp/hook-output.json
          node -e 'const a=require("/tmp/hook-output.json");if(a.hookSpecificOutput?.hookEventName!=="SessionStart")process.exit(1)'
          printf '{"hook_event_name":"PostToolBatch","session_id":"smoke01","cwd":"%s","tool_calls":[{"tool_name":"Read","tool_input":{"file_path":"%s/src/example.ts"},"tool_response":"source"}]}' "$FIXTURE" "$FIXTURE" |
            node --experimental-strip-types "$GITHUB_WORKSPACE/plugins/backlog-context/src/hook.ts" > /tmp/hook-batch.json
          # A missing Groma owner is acceptable: no scan is run by the hook.
          test ! -s /tmp/hook-batch.json || node -e 'const a=require("/tmp/hook-batch.json");if(a.hookSpecificOutput?.hookEventName!=="PostToolBatch")process.exit(1)'
          backlog task list --json > tasks-final.json
          diff -u tasks-before.json tasks-final.json
          find groma -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/groma-final.txt
          diff -u /tmp/groma-before.txt /tmp/groma-final.txt
      - name: Smoke Backlog native documents and semantic tags in disposable project
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          backlog doc create "Run term" -t other -p glossary/execution > /tmp/term-created.txt
          docid="$(sed -n 's/^Created document //p' /tmp/term-created.txt)"
          docpath="$(sed -n 's/^Path: //p' /tmp/term-created.txt)"
          test -n "$docid"
          test -n "$docpath"
          backlog doc update "$docid" --tags 'kind:term,ctx:execution,term:execution.run'
          backlog doc update "$docid" --content '# Run (execution)'
          backlog doc view "$docid" --plain > /tmp/term-view.txt
          grep -q 'execution.run' /tmp/term-view.txt
          backlog task edit TASK-1 --add-doc "$docpath"
          backlog task view TASK-1 --json > /tmp/term-task-view.json
          node -e 'const t=require("/tmp/term-task-view.json").task; if (!t.documentation || !t.documentation.some(x=>x.includes("doc-"))) process.exit(1)'
          python3 "$GITHUB_WORKSPACE/skills/backlog-agile-workflow/scripts/knowledge_graph.py" \
            "$GITHUB_WORKSPACE/skills/backlog-agile-workflow/examples/knowledge-corpus.json" --mode export --output "$FIXTURE/knowledge-okf"
          test -f "$FIXTURE/knowledge-okf/index.md"
          test -f "$FIXTURE/knowledge-okf/glossary/execution.run.md"

      - name: Navigate native Backlog snapshots with software-knowledge
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          backlog search "Run term" --json > /tmp/knowledge-search.json
          backlog task list --json > /tmp/knowledge-tasks.json
          backlog decision list --json > /tmp/knowledge-decisions.json
          python3 "$GITHUB_WORKSPACE/skills/software-knowledge/scripts/knowledge.py" \
            --backlog-only --project context-smoke \
            --backlog /tmp/knowledge-tasks.json --backlog /tmp/knowledge-decisions.json \
            --backlog /tmp/knowledge-search.json --backlog /tmp/term-task-view.json \
            snapshot > /tmp/knowledge-corpus.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          corpus = json.loads(Path('/tmp/knowledge-corpus.json').read_text())
          ids = {n['id']: n for n in corpus['nodes']}
          assert 'task:TASK-1' in ids, ids
          assert any(n['kind'] == 'decision' for n in ids.values()), ids
          assert any(n['kind'] == 'term' for n in ids.values()), ids
          assert any(e['from'] == 'task:TASK-1' and e['predicate'] == 'about' and
                     ids[e['to']]['kind'] == 'term' for e in corpus['edges']), corpus
          PY
          python3 "$GITHUB_WORKSPACE/skills/software-knowledge/scripts/knowledge.py" \
            --corpus /tmp/knowledge-corpus.json context --anchor task:TASK-1 > /tmp/knowledge-context.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('/tmp/knowledge-context.json').read_bytes()
          result = json.loads(raw)
          assert len(raw) <= 12000, len(raw)
          assert result['results'][0]['id'] == 'task:TASK-1', result
          assert any(n['kind'] == 'term' for n in result['results']), result
          PY
          backlog task list --json > /tmp/knowledge-tasks-after.json
          diff -u /tmp/knowledge-tasks.json /tmp/knowledge-tasks-after.json

      - name: Capture complete native document bodies with bounded CLI reads
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          backlog config set remoteOperations false
          backlog doc update doc-1 --content $'# Run (execution)\n\nAn identifiable execution with stable identity.'
          find backlog -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/capture-before.txt
          python3 "$GITHUB_WORKSPACE/skills/software-knowledge/scripts/capture_backlog.py" \
            --root "$FIXTURE" --project context-smoke --confirm-cli-read \
            --task TASK-1 --all-docs --max-docs 8 > /tmp/live-corpus.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          corpus = json.loads(Path('/tmp/live-corpus.json').read_bytes())
          nodes = {n['id']: n for n in corpus['nodes']}
          atom = nodes['doc:doc-1']
          assert atom['content_state'] == 'captured', atom
          assert 'stable identity' in atom['body'], atom
          assert atom['claim_state'] == 'unknown', atom
          assert corpus['capture']['captured_documents'] == ['doc-1'], corpus
          assert any(e['from'] == 'task:TASK-1' and e['to'] == 'doc:doc-1'
                     for e in corpus['edges']), corpus
          PY
          python3 "$GITHUB_WORKSPACE/skills/software-knowledge/scripts/knowledge.py" \
            --corpus /tmp/live-corpus.json search "stable identity" > /tmp/live-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('/tmp/live-result.json').read_bytes())
          assert r['results'][0]['id'] == 'doc:doc-1', r
          PY
          find backlog -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/capture-after.txt
          diff -u /tmp/capture-before.txt /tmp/capture-after.txt

      - name: Review and navigate native knowledge with external index
        run: |
          set -euo pipefail
          cd "$FIXTURE"
          export XDG_CACHE_HOME="$RUNNER_TEMP/software-knowledge-retrieval"
          k="$GITHUB_WORKSPACE/skills/software-knowledge"
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('/tmp/live-corpus.json').read_bytes())
          review={'schemaVersion':1,'kind':'architecture-review-input','project':c['project'],'anchors':['doc:doc-1'],'changedPaths':[],'intent':'verify'}
          pack={'schemaVersion':1,'kind':'context-pack-input','project':c['project'],'steps':[{'intent':'verify','anchors':['task:TASK-1']},{'mode':'sections','anchors':['doc:doc-1'],'query':'stable identity'}]}
          Path('/tmp/live-review.json').write_text(json.dumps(review))
          Path('/tmp/live-pack.json').write_text(json.dumps(pack))
          PY
          python3 "$k/scripts/knowledge.py" --corpus /tmp/live-corpus.json architecture-review /tmp/live-review.json > /tmp/live-architectural-review.json
          python3 "$k/scripts/knowledge.py" --corpus /tmp/live-corpus.json --project context-smoke --cache context-pack /tmp/live-pack.json > /tmp/live-adaptive.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/live-architectural-review.json').read_bytes())
          assert r['results'][0]['id']=='doc:doc-1',r
          p=json.loads(Path('/tmp/live-adaptive.json').read_bytes())
          assert p['calls']==2,p
          assert p['steps'][1]['response']['results'],p
          assert len(Path('/tmp/live-adaptive.json').read_bytes())<=12000,p
          PY
          test -z "$(find "$FIXTURE" -name '*.sqlite3' -print -quit)"

      - name: Reuse private Home Repo Backlog from separate source checkouts
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/home-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/home-config"
          export XDG_STATE_HOME="$RUNNER_TEMP/home-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/home-cache"
          k="$GITHUB_WORKSPACE/skills/software-knowledge"
          mkdir "$RUNNER_TEMP/code-one" "$RUNNER_TEMP/code-two"
          git -C "$RUNNER_TEMP/code-one" init -q
          git -C "$RUNNER_TEMP/code-two" init -q
          git -C "$FIXTURE" rev-parse --show-toplevel
          cd "$RUNNER_TEMP/code-one"
          python3 "$k/scripts/knowledge_home.py" recommend --home-repo "$FIXTURE" > /tmp/home-recommend.json
          python3 "$k/scripts/knowledge_home.py" init --project ecosystem --repo "$RUNNER_TEMP/code-one" --repo "$RUNNER_TEMP/code-two" --mode home-repo --provider backlog --home-repo "$FIXTURE" --confirm-private-home --confirm > /tmp/home-binding.json
          python3 "$k/scripts/knowledge_home.py" locate --repo "$RUNNER_TEMP/code-two" > /tmp/home-locate.json
          python3 "$k/scripts/capture_backlog.py" --home ecosystem --confirm-cli-read --task TASK-1 > /tmp/home-capture.json
          python3 "$k/scripts/knowledge.py" --home ecosystem context --anchor task:TASK-1 > /tmp/home-context.json
          python3 "$k/scripts/knowledge.py" --home ecosystem --cache search "stable identity" > /tmp/home-index.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          def read(n): return json.loads(Path('/tmp/home-'+n+'.json').read_text())
          assert read('recommend')['provider']=='backlog'
          assert read('locate')['binding']==read('binding')
          c=read('capture')
          assert 'nodes' in c and 'results' not in c and isinstance(c['nodes'],int),c
          p=Path(c['snapshot'])
          assert p.is_relative_to(Path(os.environ['XDG_STATE_HOME'])) and p.stat().st_mode & 0o777==0o600,p
          assert read('context')['results'][0]['id']=='task:TASK-1',read('context')
          assert read('index')['results'][0]['id']=='doc:doc-1',read('index')
          PY
          cd "$FIXTURE"
          find backlog -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/home-backlog-after.txt
          diff -u /tmp/capture-after.txt /tmp/home-backlog-after.txt
          test -z "$(git -C "$RUNNER_TEMP/code-one" status --porcelain --untracked-files=all)"
          test -z "$(git -C "$RUNNER_TEMP/code-two" status --porcelain --untracked-files=all)"
          test -z "$(find "$FIXTURE" "$RUNNER_TEMP/code-one" "$RUNNER_TEMP/code-two" -name '*.sqlite3' -print -quit)"
