name: Validate agent skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test contextual Claude hooks
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --test plugins/backlog-context/tests/*.test.mjs
      - name: Validate contextual plugin and marketplace manifests
        run: |
          python3 -m json.tool plugins/backlog-context/hooks/hooks.json > /dev/null
          python3 -m json.tool plugins/backlog-context/.claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Validate skill manifests and local references
        run: python3 scripts/validate_skills.py
      - name: Run supervised task loop tests
        run: python3 -m unittest discover -s skills/supervised-task-loop/tests -p 'test_*.py' -v
      - name: Run delegated task loop tests
        run: python3 -m unittest discover -s skills/delegated-task-loop/tests -p 'test_*.py' -v
      - name: Run collection validator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check Backlog CRUD command-plan smoke
        run: python3 skills/backlog-agile-workflow/scripts/board_crud.py skills/backlog-agile-workflow/examples/board-create.json
      - name: Check Backlog spec projection smoke
        run: python3 skills/backlog-agile-workflow/scripts/spec_projection.py skills/backlog-agile-workflow/examples/spec-packet.json skills/backlog-agile-workflow/examples/spec-existing-tasks.json
      - name: Run pure-functional-design router tests
        run: python3 -m unittest discover -s skills/pure-functional-design/tests -p 'test_*.py' -v
      - name: Check pure-functional-design navigation smoke
        run: python3 skills/pure-functional-design/scripts/affordances.py skills/pure-functional-design/examples/design-kotlin.json
      - name: Run Goldfish review contract tests
        run: python3 -m unittest discover -s skills/goldfish-review/tests -p 'test_*.py' -v
      - name: Goldfish contract example smoke
        run: |
          python3 skills/goldfish-review/scripts/review_contract.py validate-request skills/goldfish-review/examples/request.json
          python3 skills/goldfish-review/scripts/review_contract.py aggregate skills/goldfish-review/examples/request.json skills/goldfish-review/examples/reports.json
          python3 skills/goldfish-review/scripts/review_contract.py drift skills/goldfish-review/examples/baseline.json skills/goldfish-review/examples/current.json
      - name: Run software-knowledge unit tests
        run: python3 -m unittest discover -s skills/software-knowledge/tests -p 'test_*.py' -v
      - name: Initialize private user-local home outside consumer repository
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/private-data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/private-config"
          export XDG_STATE_HOME="$RUNNER_TEMP/private-state"
          export XDG_CACHE_HOME="$RUNNER_TEMP/private-cache"
          mkdir "$RUNNER_TEMP/consumer-repo"
          git -C "$RUNNER_TEMP/consumer-repo" init -q
          k=skills/software-knowledge
          python3 "$k/scripts/knowledge_home.py" init --project demo --repo "$RUNNER_TEMP/consumer-repo" --mode user-local --provider markdown --confirm > /tmp/private-home.json
          python3 "$k/scripts/knowledge.py" --home demo --cache overview > /tmp/private-home-overview.json
          test -z "$(git -C "$RUNNER_TEMP/consumer-repo" status --porcelain --untracked-files=all)"
          test -z "$(find "$RUNNER_TEMP/consumer-repo" -name '*.sqlite3' -print -quit)"
      - name: Check active knowledge navigation smoke
        run: python3 skills/software-knowledge/scripts/knowledge.py --corpus skills/software-knowledge/examples/corpus.json context --anchor execution.terminal
      - name: Evaluate retrieval on labeled synthetic questions
        run: python3 skills/software-knowledge/scripts/evaluate.py skills/software-knowledge/examples/corpus.json skills/software-knowledge/examples/questions.json
      - name: Measure incremental knowledge indexing outside checkout
        run: |
          export XDG_CACHE_HOME="$RUNNER_TEMP/knowledge-index-cache"
          python3 skills/software-knowledge/scripts/benchmark_index.py --size 1000 --repeat 3
          test -z "$(find skills -name '*.sqlite3' -print -quit)"
      - name: Exercise architecture, adaptive packs and federation from public examples
        run: |
          set -euo pipefail
          k=skills/software-knowledge
          python3 "$k/scripts/knowledge.py" --corpus "$k/examples/corpus.json" architecture-review "$k/examples/architecture-review.json" > /tmp/arch-review.json
          python3 "$k/scripts/knowledge.py" --corpus "$k/examples/corpus.json" context-pack "$k/examples/context-pack.json" > /tmp/arch-pack.json
          python3 "$k/scripts/federation.py" "$k/examples/federation.json" --source "example-runtime=$k/examples/corpus.json" --project example-runtime --node execution.terminal > /tmp/arch-federation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/arch-review.json').read_bytes())
          assert r['results'][0]['id']=='execution.terminal' and not r['edit_authorized'],r
          p=json.loads(Path('/tmp/arch-pack.json').read_bytes())
          assert p['calls']==3 and len(Path('/tmp/arch-pack.json').read_bytes())<=12000,p
          f=json.loads(Path('/tmp/arch-federation.json').read_bytes())
          assert f['results'][0]['links'][0]['status']=='explicit-source-required',f
          PY
      - name: Compare retrieval against selected real skill documentation
        run: |
          set -euo pipefail
          k=skills/software-knowledge
          python3 "$k/scripts/evaluate_docs.py" --root "$GITHUB_WORKSPACE" "$k/examples/documentation-evaluation.json" > /tmp/knowledge-real-doc-eval.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/knowledge-real-doc-eval.json').read_bytes())
          assert r['questions']==8 and r['dataset']['documents']==8,r
          assert r['aggregate']['adaptive']['correct_abstention']==1,r
          # On unanchored documentation queries, preserve direct ranking, not forced graph expansion.
          assert r['aggregate']['adaptive']['mrr']==r['aggregate']['ranked']['mrr'],r
          assert r['aggregate']['adaptive']['ndcg_at_k']==r['aggregate']['ranked']['ndcg_at_k'],r
          for name, stats in r['aggregate'].items():
              print(name,json.dumps(stats,sort_keys=True))
          PY
      - name: Verify existing provider handoff contracts without cross-skill imports
        run: |
          set -euo pipefail
          k=skills/software-knowledge
          # Use the real M5 producer on its own existing synthetic ledger fixture, in a separate process.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('skills/cognicode-diagrams/tests').resolve()))
          from test_report_thinking import ReportThinkingTests, capsule
          fixture=ReportThinkingTests()
          fixture.setUp()
          try:
              result=capsule.build(fixture.repo,'App::Store','Review persistence',home=fixture.home)
              Path('/tmp/provider-capsule.json').write_bytes(Path(result['json']).read_bytes())
          finally:
              fixture.tearDown()
          PY
          python3 "$k/scripts/architecture.py" capsule-ref /tmp/provider-capsule.json --project demo --locator handoff-7 > /tmp/provider-ref.json
          python3 "$k/scripts/architecture.py" groma-refs skills/backlog-agile-workflow/examples/groma-task-links.json --project demo --scope execution > /tmp/groma-refs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/provider-ref.json').read_bytes())
          assert r['external_ids']['symbol']=='App::Store',r
          assert 'R1' in r['external_ids']['claims'] and 'Q1' in r['external_ids']['queries'],r
          assert 'observed_relations' not in r,r
          g=json.loads(Path('/tmp/groma-refs.json').read_bytes())
          assert g['observations'][0]['locator']=='http-adapter' and not g['observations'][0]['paths'],g
          PY
      - name: Validate paired agent evaluation contract without claiming agent runs
        run: |
          set -euo pipefail
          k=skills/software-knowledge
          python3 "$k/scripts/evaluate_trials.py" "$k/examples/agent-trial-plan.json" > /tmp/agent-eval-empty.json
          python3 "$k/scripts/evaluate_trials.py" "$k/examples/agent-trial-plan.json" /tmp/agent-eval-empty.json > /tmp/agent-eval-report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/agent-eval-report.json').read_bytes())
          assert r['planned_cases']==4 and r['observed_runs']==0 and r['status']=='not-evaluated',r
          assert r['aggregate']['input_tokens']['median_delta'] is None,r
          PY
      - name: Verify software knowledge HATEOAS first entrypoint
        run: |
          set -euo pipefail
          k=skills/software-knowledge
          python3 "$k/scripts/affordances.py" "$k/examples/session-verify.json" > /tmp/knowledge-route.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/knowledge-route.json').read_bytes())
          assert r['decision']=='READY' and len(r['lenses'])<=2,r
          assert any(l.get('operation',{}).get('command')=='context' for l in r['_links']),r
          PY
          python3 "$k/scripts/knowledge.py" --corpus "$k/examples/corpus.json" --detail evidence context --anchor execution.terminal --intent verify > /tmp/routed-knowledge.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/routed-knowledge.json').read_bytes())
          assert r['results'][0]['id']=='execution.terminal' and 'sources' in r['results'][0],r
          PY
      - name: Run backlog-agile-workflow unit tests
        run: python3 -m unittest discover -s skills/backlog-agile-workflow/tests -p 'test_*.py' -v
      - name: Check backlog-agile-workflow navigation smoke
        run: python3 skills/backlog-agile-workflow/scripts/affordances.py skills/backlog-agile-workflow/examples/triage.json
      - name: Check backlog-agile-workflow readiness snapshot smoke
        run: python3 skills/backlog-agile-workflow/scripts/ready_candidates.py skills/backlog-agile-workflow/examples/ready-list.json
      - name: Run gate vocabulary reachability tests
        run: python3 -m unittest discover -s skills/gate-vocabulary-reachability/tests -p 'test_*.py' -v
      - name: Run skill utility tests
        run: python3 -m unittest discover -s skills/code-quality-evidence-review/tests -p 'test_*.py' -v
      - name: Run CogniCode diagrams router tests
        run: python3 -m unittest discover -s skills/cognicode-diagrams/tests -p 'test_*.py' -v
      - name: Check CogniCode diagrams affordances smoke
        run: python3 skills/cognicode-diagrams/scripts/affordances.py skills/cognicode-diagrams/examples/session-c4.json
      - name: Run PipelineK local CI impact planner tests
        run: python3 -m unittest discover -s skills/pipelinek-local-ci/tests -p 'test_*.py' -v
      - name: Run delivery-first-testing router tests
        run: python3 -m unittest discover -s skills/delivery-first-testing/tests -p 'test_*.py' -v
      - name: Check delivery-first-testing navigation smoke
        run: python3 skills/delivery-first-testing/scripts/affordances.py skills/delivery-first-testing/examples/session-feature.json
      - name: Check ephemeral harness lifecycle
        run: bash skills/delivery-first-testing/tests/test_harness.sh
      - name: Run distribution-first-release tests
        run: python3 -m unittest discover -s skills/distribution-first-release/tests -p 'test_*.py' -v
      - name: Check distribution-first-release navigation smoke
        run: python3 skills/distribution-first-release/scripts/affordances.py skills/distribution-first-release/examples/session-release.json
      - name: Run playful-learning-design router tests
        run: python3 -m unittest discover -s skills/playful-learning-design/tests -p 'test_*.py' -v
      - name: Check playful-learning-design navigation smoke
        run: python3 skills/playful-learning-design/scripts/affordances.py skills/playful-learning-design/examples/session-create.json
      - name: Run learning-game-html router tests
        run: python3 -m unittest discover -s skills/learning-game-html/tests -p 'test_*.py' -v
      - name: Check learning-game-html navigation smoke
        run: python3 skills/learning-game-html/scripts/affordances.py skills/learning-game-html/examples/session-create.json
      - name: Run agent-context-audit tests
        run: python3 -m unittest discover -s skills/agent-context-audit/tests -p 'test_*.py' -v
      - name: Check agent-context-audit measurement smoke
        run: python3 skills/agent-context-audit/scripts/measure_context.py --project . --config .
